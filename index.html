<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絵文字神経衰弱 - 記憶力テスト</title>
<style>
  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #fdfcf0;
    margin: 0;
    padding: 40px 20px;
  }

  h1 { color: #444; margin-bottom: 5px; }
  
  /* メッセージ表示エリア */
  #status-message {
    font-size: 1.2rem;
    color: #e67e22;
    font-weight: bold;
    height: 1.5rem;
    margin-bottom: 10px;
  }

  .stats {
    font-size: 1.1rem;
    margin-bottom: 20px;
    color: #666;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    gap: 12px;
    perspective: 1000px;
  }

  .card {
    width: 80px;
    height: 80px;
    cursor: pointer;
    position: relative;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card .front, .card .back {
    position: absolute;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  /* 裏面 */
  .card .front {
    background-color: #34495e;
    color: #ecf0f1;
    font-size: 32px;
  }

  /* 表面 */
  .card .back {
    background-color: #fff;
    font-size: 42px;
    transform: rotateY(180deg);
  }

  button {
    margin-top: 30px;
    padding: 12px 30px;
    font-size: 1rem;
    font-weight: bold;
    color: #fff;
    background-color: #e67e22;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 0 #d35400;
  }

  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #d35400; }
  
  /* プレビュー中はクリックできないようにする */
  .disabled { pointer-events: none; }
</style>
</head>
<body>

<h1>3秒でやきつけろ！君の目に！</h1>
<div id="status-message">位置を覚えてね！</div>
<div class="stats">間違えた回数: <span id="mistakes">0</span> 回</div>

<div class="grid" id="grid"></div>

<button onclick="initGame()">もういちど遊ぶ</button>

<script>
  const emojis = ['🐱', '🐶', '🐰', '🦊', '🐼', '🐨', '🐯', '🦁'];
  let cards = [...emojis, ...emojis];
  let mistakes = 0;
  let firstCard = null;
  let secondCard = null;
  let lockBoard = true; // 最初は操作不能にする
  let matchedPairs = 0;

  const grid = document.getElementById('grid');
  const mistakesDisplay = document.getElementById('mistakes');
  const statusMsg = document.getElementById('status-message');

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  async function initGame() {
    grid.innerHTML = '';
    mistakes = 0;
    matchedPairs = 0;
    mistakesDisplay.textContent = mistakes;
    lockBoard = true;
    statusMsg.textContent = "位置を覚えてね！";
    
    shuffle(cards);
    
    // カード生成
    const cardElements = [];
    cards.forEach((emoji) => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.dataset.emoji = emoji;
      
      const front = document.createElement('div');
      front.classList.add('front');
      front.textContent = '？';
      
      const back = document.createElement('div');
      back.classList.add('back');
      back.textContent = emoji;
      
      card.appendChild(front);
      card.appendChild(back);
      card.addEventListener('click', flipCard);
      grid.appendChild(card);
      cardElements.push(card);
    });

    // --- ここから追加：プレビュー演出 ---
    // 0.5秒後に全カードをオープン
    setTimeout(() => {
      cardElements.forEach(card => card.classList.add('flipped'));
    }, 500);

    // 3秒間見せてから、すべて閉じる
    setTimeout(() => {
      cardElements.forEach(card => card.classList.remove('flipped'));
      statusMsg.textContent = "スタート！";
      lockBoard = false; // ここで初めて遊べるようになる
    }, 3500);
  }

  function flipCard() {
    if (lockBoard || this === firstCard || this.classList.contains('flipped')) return;
    
    this.classList.add('flipped');
    
    if (!firstCard) {
      firstCard = this;
      return;
    }
    
    secondCard = this;
    checkForMatch();
  }

  function checkForMatch() {
    const isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
    isMatch ? disableCards() : unflipCards();
    if (!isMatch) {
      mistakes++;
      mistakesDisplay.textContent = mistakes;
    }
  }

  function disableCards() {
    matchedPairs++;
    firstCard = null;
    secondCard = null;
    if (matchedPairs === emojis.length) {
      statusMsg.textContent = "クリア！おめでとう！";
      setTimeout(() => alert(`クリア！\nスコア: ${mistakes}回`), 500);
    }
  }

  function unflipCards() {
    lockBoard = true;
    setTimeout(() => {
      firstCard.classList.remove('flipped');
      secondCard.classList.remove('flipped');
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }, 800);
  }

  initGame();
</script>
</body>
</html>

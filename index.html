<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絵文字神経衰弱 - 記憶力テスト2</title>
<style>
  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(to bottom, #9edff2 0%, #d9f3d0 58%, #6db56d 58%, #4d995b 100%);
    margin: 0;
    padding: 40px 20px;
  }

  body::before {
    content: "";
    position: fixed;
    z-index: -1;
    inset: 0;
    opacity: 0.65;
    background:
      radial-gradient(circle at 8% 47%, #4d9b58 0 8%, transparent 8.2%),
      radial-gradient(circle at 18% 43%, #62ad5b 0 11%, transparent 11.2%),
      radial-gradient(circle at 87% 45%, #4d9b58 0 10%, transparent 10.2%),
      radial-gradient(circle at 96% 40%, #72b965 0 13%, transparent 13.2%),
      radial-gradient(circle at 50% 9%, rgba(255, 255, 255, 0.8) 0 5%, transparent 5.2%);
    pointer-events: none;
  }

  body::after {
    content: "";
    position: fixed;
    z-index: -1;
    left: 0;
    right: 0;
    bottom: 0;
    height: 14px;
    opacity: 0.7;
    background: repeating-linear-gradient(90deg, #8b5a3c 0 7px, transparent 7px 42px);
    border-top: 6px solid #a96e48;
    pointer-events: none;
  }

  h1 { color: #444; margin-bottom: 5px; }
  
  /* メッセージ表示エリア */
  #status-message {
    font-size: 1.2rem;
    color: #e67e22;
    font-weight: bold;
    height: 1.5rem;
    margin-bottom: 10px;
  }

  .stats {
    font-size: 1.1rem;
    margin-bottom: 20px;
    color: #666;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    gap: 12px;
    perspective: 1000px;
  }

  .card {
    width: 80px;
    height: 80px;
    cursor: pointer;
    position: relative;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card .front, .card .back {
    position: absolute;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  /* 裏面 */
  .card .front {
    background-color: #34495e;
    color: #ecf0f1;
    font-size: 32px;
  }

  /* 表面 */
  .card .back {
    background-color: #fff;
    font-size: 42px;
    transform: rotateY(180deg);
  }

  button {
    margin-top: 30px;
    padding: 12px 30px;
    font-size: 1rem;
    font-weight: bold;
    color: #fff;
    background-color: #e67e22;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 0 #d35400;
  }

  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #d35400; }
  
  /* プレビュー中はクリックできないようにする */
  .disabled { pointer-events: none; }
</style>
</head>
<body>

<h1>3秒でやきつけろ！君のその目に！！</h1>
<div id="status-message">位置を覚えてね！</div>
<div class="stats">間違えた回数: <span id="mistakes">0</span> 回</div>

<div class="grid" id="grid"></div>

<button onclick="initGame()">もういちど遊ぶ</button>

<script>
  const emojis = ['🐱', '🐶', '🐰', '🦊', '🐼', '🐨', '🐯', '🦁'];
  let cards = [...emojis, ...emojis];
  let mistakes = 0;
  let firstCard = null;
  let secondCard = null;
  let lockBoard = true; // 最初は操作不能にする
  let matchedPairs = 0;
  let audioContext = null;

  const grid = document.getElementById('grid');
  const mistakesDisplay = document.getElementById('mistakes');
  const statusMsg = document.getElementById('status-message');

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function playTone(frequency, duration, type = 'sine', volume = 0.08, startTime = 0) {
    audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const start = audioContext.currentTime + startTime;

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(start);
    oscillator.stop(start + duration);
  }

  function playFlipSound() {
    playTone(520, 0.1, 'triangle', 0.06);
  }

  function playSuccessSound() {
    playTone(523, 0.16, 'sine', 0.08);
    playTone(659, 0.16, 'sine', 0.08, 0.08);
    playTone(784, 0.24, 'sine', 0.08, 0.16);
  }

  function playMissSound() {
    playTone(220, 0.18, 'sawtooth', 0.05);
    playTone(165, 0.28, 'sawtooth', 0.05, 0.12);
  }

  async function initGame() {
    grid.innerHTML = '';
    mistakes = 0;
    matchedPairs = 0;
    mistakesDisplay.textContent = mistakes;
    lockBoard = true;
    statusMsg.textContent = "位置を覚えてね！";
    
    shuffle(cards);
    
    // カード生成
    const cardElements = [];
    cards.forEach((emoji) => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.dataset.emoji = emoji;
      
      const front = document.createElement('div');
      front.classList.add('front');
      front.textContent = '？';
      
      const back = document.createElement('div');
      back.classList.add('back');
      back.textContent = emoji;
      
      card.appendChild(front);
      card.appendChild(back);
      card.addEventListener('click', flipCard);
      grid.appendChild(card);
      cardElements.push(card);
    });

    // --- ここから追加：プレビュー演出 ---
    // 0.5秒後に全カードをオープン
    setTimeout(() => {
      cardElements.forEach(card => card.classList.add('flipped'));
    }, 500);

    // 3秒間見せてから、すべて閉じる
    setTimeout(() => {
      cardElements.forEach(card => card.classList.remove('flipped'));
      statusMsg.textContent = "スタート！";
      lockBoard = false; // ここで初めて遊べるようになる
    }, 3500);
  }

  function flipCard() {
    if (lockBoard || this === firstCard || this.classList.contains('flipped')) return;
    
    this.classList.add('flipped');
    playFlipSound();
    
    if (!firstCard) {
      firstCard = this;
      return;
    }
    
    secondCard = this;
    checkForMatch();
  }

  function checkForMatch() {
    const isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
    isMatch ? disableCards() : unflipCards();
    if (!isMatch) {
      playMissSound();
      mistakes++;
      mistakesDisplay.textContent = mistakes;
    }
  }

  function disableCards() {
    matchedPairs++;
    playSuccessSound();
    firstCard = null;
    secondCard = null;
    if (matchedPairs === emojis.length) {
      statusMsg.textContent = "クリア！おめでとう！";
      setTimeout(() => alert(`クリア！\nスコア: ${mistakes}回`), 500);
    }
  }

  function unflipCards() {
    lockBoard = true;
    setTimeout(() => {
      firstCard.classList.remove('flipped');
      secondCard.classList.remove('flipped');
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }, 800);
  }

  initGame();
</script>
</body>
</html>
